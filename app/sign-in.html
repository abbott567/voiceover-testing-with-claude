<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - Example service</title>
  <link rel="preload" href="/assets/fonts/ibm-plex-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    /*
      Styling borrowed from craigabbott.co.uk: IBM Plex Sans, the pink
      primary and plum accent palettes, outlined h1, wavy link hover,
      and the bordered button with a hard 2px shadow. Colours use
      light-dark() so the page follows the system colour scheme like
      the real site does.
    */

    @font-face {
      font-family: "IBM Plex Sans";
      font-style: normal;
      font-weight: 100 700;
      src: url(/assets/fonts/ibm-plex-sans-latin-wght-normal.woff2) format("woff2-variations");
      font-display: swap;
    }

    @font-face {
      font-family: "IBM Plex Sans";
      font-style: italic;
      font-weight: 100 700;
      src: url(/assets/fonts/ibm-plex-sans-latin-wght-italic.woff2) format("woff2-variations");
      font-display: swap;
    }

    @font-face {
      font-family: "IBM Plex Sans Fallback";
      src: local("Arial");
      size-adjust: 99.71%;
      ascent-override: 102.8%;
      descent-override: 27.58%;
      line-gap-override: 0%;
    }

    :root {
      color-scheme: light dark;

      --ratio: 1.5;
      --s0: 1.1875rem;
      --s1: calc(var(--s0) * var(--ratio));
      --s2: calc(var(--s1) * var(--ratio));
      --s3: calc(var(--s2) * var(--ratio));
      --s-1: calc(var(--s0) / var(--ratio));
      --s-2: calc(var(--s-1) / var(--ratio));

      --space-xxxs: var(--s-2);
      --space-xxs: var(--s-1);
      --space-xs: var(--s0);
      --space-s: var(--s1);
      --space-m: var(--s2);
      --space-l: var(--s3);
      --space-xl: calc(var(--space-l) * var(--ratio));

      --font-family: "IBM Plex Sans", "IBM Plex Sans Fallback", sans-serif;
      --font-size-xs: 1rem;
      --font-size-s: var(--s0);
      --font-size-m: var(--s1);
      --font-size-l: var(--s2);
      --font-size-xl: var(--s3);

      --tap-size: 44px;
      --width-text: 60ch;

      /* Neutrals */
      --c-4-neutral: light-dark(#150307, #180f24);
      --c-2-neutral: light-dark(#382126, #251736);
      --c-1-neutral: light-dark(#4b3237, #4e346d);
      --c0-neutral: light-dark(#5e4449, #3e2d53);
      --c1-neutral: light-dark(#866a6f, #634785);
      --c2-neutral: light-dark(#b09297, #a893a8);
      --c3-neutral: light-dark(#ecd5db, #c1b4c5);
      --c4-neutral: light-dark(#fdeaef, #eae1ed);
      --c-ghost-neutral: light-dark(#5e44490a, #63478533);

      /* Primary (pink) */
      --c-1-primary: light-dark(#a2315b, #d7428f);
      --c0-primary: light-dark(#ca567d, #f075b5);
      --c1-primary: light-dark(#e87197, #fa9ece);
      --c2-primary: light-dark(#ff8db2, #ffcce6);

      /* Accent (plum) */
      --c-2-accent: light-dark(#382447, #936243);
      --c-1-accent: light-dark(#4e385e, #c47645);
      --c0-accent: light-dark(#644e75, #df8f5d);
      --c1-accent: light-dark(#88719b, #f4b994);

      /* Success and error */
      --c-1-success: light-dark(#196449, #5ec98b);
      --c1-success: light-dark(#5ca184, #8de7b3);
      --c-ghost-success: light-dark(#4e745e1a, #5ec98b1a);
      --c-1-error: light-dark(#812433, #ec5151);
      --c0-error: light-dark(#9f404b, #ec5151);
      --c1-error: light-dark(#c5626b, #fc8d8d);
      --c-ghost-error: light-dark(#a136361a, #ec51511a);

      /* Semantic colours */
      --colour-page: light-dark(var(--c4-neutral), var(--c-4-neutral));
      --colour-surface: light-dark(var(--c3-neutral), var(--c-2-neutral));
      --colour-border: var(--c1-neutral);
      --colour-border-faint: light-dark(var(--c2-neutral), var(--c0-neutral));
      --colour-text-body: light-dark(var(--c-4-neutral), var(--c4-neutral));
      --colour-text-subdued: light-dark(var(--c-1-neutral), var(--c3-neutral));
      --colour-text-accent: var(--c0-accent);
      --colour-text-link: var(--colour-text-accent);
      --colour-text-link-hover: light-dark(var(--c-1-accent), var(--c1-accent));
      --colour-text-success: light-dark(var(--c-1-success), var(--c1-success));
      --colour-text-error: light-dark(var(--c-1-error), var(--c1-error));
      --colour-focus-highlight: light-dark(var(--c0-primary), var(--c2-primary));
      --colour-focus-text: light-dark(var(--c-1-primary), var(--c2-primary));
      --colour-selection: light-dark(var(--c-1-primary), var(--c0-primary));

      --focus-outline: 3px solid var(--colour-focus-highlight);
      --focus-outline-offset: 4px;
      --focus-box-shadow: 0 0 0 4px var(--colour-page);
      --text-underline-offset: .125em;
    }

    @media (max-width: 559px) {
      :root {
        --ratio: 1.3;
      }
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body,
    h1,
    h2,
    p {
      margin: 0;
    }

    body {
      min-height: 100vh;
      font-family: var(--font-family);
      font-size: var(--font-size-s);
      line-height: 1.5;
      color: var(--colour-text-body);
      background-color: var(--colour-page);
    }

    ::selection {
      color: var(--colour-page);
      background-color: var(--colour-selection);
    }

    button,
    h1,
    h2,
    input,
    label {
      line-height: 1.1;
    }

    h1,
    h2 {
      font-weight: 700;
      text-wrap: balance;
    }

    /* Outlined h1, as on the site */
    h1 {
      --_colour-stroke: var(--c1-primary);
      font-size: var(--font-size-xl);
      color: var(--colour-surface);
      text-shadow:
        -1px -1px 0 var(--_colour-stroke),
        1px -1px 0 var(--_colour-stroke),
        -1px 1px 0 var(--_colour-stroke),
        1px 1px 0 var(--_colour-stroke);
    }

    @supports (-webkit-text-stroke: 1px black) {
      h1 {
        --_colour-stroke: light-dark(var(--c0-accent), var(--c1-primary));
        -webkit-text-stroke: .07em var(--_colour-stroke);
        text-shadow: none;
        paint-order: stroke fill;
      }
    }

    @media (forced-colors: active) {
      h1 {
        -webkit-text-stroke: 0;
        text-shadow: none;
      }
    }

    h2 {
      font-size: var(--font-size-l);
    }

    a {
      color: var(--colour-text-link);
      text-underline-offset: var(--text-underline-offset);
    }

    a:hover {
      color: var(--colour-text-link-hover);
      text-decoration-line: underline;
      text-decoration-style: wavy;
      text-decoration-color: var(--colour-text-link-hover);
    }

    /* Header */
    .site-header {
      border-bottom: 1px solid var(--colour-border);
    }

    .site-header-bar {
      display: flex;
      gap: var(--space-xs);
      align-items: center;
      width: min(1400px, 100% - var(--space-xs) * 2);
      margin-inline: auto;
      padding-block: var(--space-xxs);
    }

    .site-logo-link {
      display: flex;
      align-items: center;
      gap: var(--space-xxs);
      padding: var(--space-xxs);
      color: var(--colour-text-body);
      font-weight: 500;
      text-decoration: none;
    }

    .site-logo-link:hover {
      --_logo-ink: var(--colour-text-link-hover);
      color: var(--colour-text-link-hover);
      text-decoration: underline wavy var(--colour-text-link-hover);
    }

    .site-logo {
      display: flex;
      width: 3.5rem;
      flex-shrink: 0;
    }

    .site-logo svg {
      width: 100%;
      height: auto;
    }

    .logo-site-stop {
      fill: var(--c0-primary);
    }

    @media (forced-colors: active) {
      .logo-site-stop,
      .logo-site-swoosh {
        fill: LinkText;
      }
    }

    /* Main */
    main {
      width: min(840px, 100% - var(--space-xs) * 2);
      margin-inline: auto;
      margin-block-start: var(--space-xl);
      padding-block-end: var(--space-xl);
    }

    .page-heading {
      padding-block-end: var(--space-s);
      margin-block-end: var(--space-m);
      border-bottom: 1px solid var(--colour-border);
    }

    form {
      max-width: var(--width-text);
    }

    .field {
      margin-block-end: var(--space-s);
    }

    .field--error {
      padding-inline-start: var(--space-xs);
      border-inline-start: 5px solid var(--colour-text-error);
    }

    label {
      display: block;
      margin-block-end: var(--space-xxs);
      font-weight: 500;
      cursor: pointer;
    }

    input {
      --_colour-border: var(--colour-text-body);
      width: 100%;
      padding: var(--space-xxxs) var(--space-xxs);
      font-family: inherit;
      font-size: inherit;
      line-height: 1;
      color: var(--colour-text-body);
      background: var(--colour-page);
      border: 2px solid var(--_colour-border);
    }

    .input--error {
      --_colour-border: var(--colour-text-error);
    }

    .error-message {
      margin-block-end: var(--space-xxs);
      font-weight: 500;
      color: var(--colour-text-error);
    }

    .error-summary {
      margin-block-end: var(--space-m);
      padding: var(--space-xs);
      background: var(--c-ghost-error);
      border: 2px solid var(--colour-text-error);
      border-inline-start-width: 5px;
    }

    .error-summary h2 {
      margin-block-end: var(--space-xxs);
      font-size: var(--font-size-m);
      color: var(--colour-text-error);
    }

    .error-summary ul {
      margin: 0;
      padding-inline-start: 1.25em;
    }

    .error-summary li + li {
      margin-block-start: var(--space-xxxs);
    }

    .error-summary a {
      color: var(--colour-text-error);
      font-weight: 500;
    }

    .error-summary a:hover {
      color: var(--colour-text-error);
      text-decoration-color: var(--colour-text-error);
    }

    .panel {
      padding: var(--space-s) var(--space-xs);
      background: var(--c-ghost-success);
      border: 2px solid var(--colour-text-success);
      border-inline-start-width: 5px;
    }

    .panel h1 {
      margin-block-end: var(--space-xxs);
      font-size: var(--font-size-l);
      color: var(--colour-text-body);
      -webkit-text-stroke: 0;
      text-shadow: none;
    }

    .panel p {
      color: var(--colour-text-subdued);
    }

    button {
      min-height: var(--tap-size);
      padding: var(--space-xxxs) var(--space-xs);
      font: inherit;
      font-weight: 500;
      color: var(--colour-text-body);
      cursor: pointer;
      background: transparent;
      border: 1px solid var(--colour-border);
      box-shadow: 0 2px 0 var(--colour-border);
    }

    button:hover {
      color: var(--colour-text-link-hover);
      outline: .1rem dotted var(--colour-border-faint);
      background: var(--colour-surface);
    }

    /*
      Focus, matching the site's pink outline with a page-coloured halo.
      The error summary and success panel use :focus rather than
      :focus-visible so the ring shows however focus was moved there.
    */
    a:focus-visible,
    button:focus-visible,
    input:focus-visible,
    [tabindex="-1"]:focus {
      outline: var(--focus-outline);
      outline-offset: var(--focus-outline-offset);
      box-shadow: var(--focus-box-shadow);
    }

    a:focus-visible {
      color: var(--colour-focus-text);
      text-decoration-color: var(--colour-focus-highlight);
    }

    button:focus-visible {
      color: var(--colour-focus-highlight);
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

  </header>

  <main id="main">
    <div class="error-summary" id="error-summary" tabindex="-1" hidden>
      <div role="alert">
        <h2>There is a problem</h2>
        <ul id="error-list"></ul>
      </div>
    </div>

    <div id="sign-in">
      <div class="page-heading">
        <h1>Sign in</h1>
      </div>

      <form id="sign-in-form" method="post" action="/sign-in" novalidate>
        <div class="field" id="email-field">
          <label for="email">Email address</label>
          <p class="error-message" id="email-error" hidden>
            <span class="visually-hidden">Error:</span> Enter your email address
          </p>
          <input id="email" name="email" type="email" autocomplete="email" spellcheck="false">
        </div>

        <div class="field" id="password-field">
          <label for="password">Password</label>
          <p class="error-message" id="password-error" hidden>
            <span class="visually-hidden">Error:</span> Enter your password
          </p>
          <input id="password" name="password" type="password" autocomplete="current-password">
        </div>

        <button type="submit">Sign in</button>
      </form>
    </div>

    <div class="panel" id="success" tabindex="-1" hidden>
      <h1>You are signed in</h1>
      <p>This is as far as the example goes.</p>
    </div>
  </main>

  <script>
    const form = document.getElementById("sign-in-form");
    const signIn = document.getElementById("sign-in");
    const summary = document.getElementById("error-summary");
    const list = document.getElementById("error-list");
    const success = document.getElementById("success");

    const fields = [
      { id: "email", message: "Enter your email address" },
      { id: "password", message: "Enter your password" },
    ];

    function clearError(field) {
      const input = document.getElementById(field.id);
      document.getElementById(`${field.id}-field`).classList.remove("field--error");
      document.getElementById(`${field.id}-error`).hidden = true;
      input.classList.remove("input--error");
      input.removeAttribute("aria-describedby");
    }

    function showError(field) {
      const input = document.getElementById(field.id);
      document.getElementById(`${field.id}-field`).classList.add("field--error");
      document.getElementById(`${field.id}-error`).hidden = false;
      input.classList.add("input--error");
      input.setAttribute("aria-describedby", `${field.id}-error`);

      const link = document.createElement("a");
      link.href = `#${field.id}`;
      link.textContent = field.message;
      const item = document.createElement("li");
      item.appendChild(link);
      list.appendChild(item);
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      fields.forEach(clearError);
      list.textContent = "";

      const errors = fields.filter(
        (field) => document.getElementById(field.id).value.trim() === ""
      );

      if (errors.length === 0) {
        summary.hidden = true;
        signIn.hidden = true;
        success.hidden = false;
        success.focus();
        return;
      }

      errors.forEach(showError);
      summary.hidden = false;

      // Moving focus to the error summary is what the second scenario in
      // features/sign-in.feature checks for. Comment out the next line to
      // see what a failing report looks like.
      summary.focus();
    });

    // Error summary links move focus to the field they describe.
    list.addEventListener("click", (event) => {
      const link = event.target.closest("a");
      if (!link) return;
      event.preventDefault();
      document.getElementById(link.getAttribute("href").slice(1)).focus();
    });
  </script>
